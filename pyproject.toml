[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WeChatAnget"
version = "1.0.0"
description = "微信 4.x 消息监控、AI 托管自动回复与桌面智能助手 (基于本地 SQLite 解密与 UI 自动化)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "feng62" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "pywin32>=306",
    "pycryptodomex>=3.18.0",
    "Pillow>=9.5.0",
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
